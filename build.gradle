plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.96'
    id "net.darkhax.curseforgegradle" version "1.1.28"
    id "com.modrinth.minotaur" version "2.2.1"
}

def secrets = new Properties()
def secretsFile = file('secrets.properties')
if (secretsFile.exists()) {
    secretsFile.withInputStream {
        stream -> secrets.load(stream)
    }

    fileTree("secrets").matching {
        include "**/*.properties"
    }.each {
        File file ->
            file.withInputStream {
                stream -> secrets.load(stream)
            }
    }
}

version = mod_version
group = mod_group_id
var mrToken = secrets.getProperty('mr_token')
var mrID = modrinth_id
var cfToken = secrets.getProperty('cf_token')
var cfID = curseforge_id

repositories {
    maven {
        // location of the maven that hosts JEI files since January 2023
        // location of the maven for Vazkii's mods
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

base {
    archivesName = mod_id + "-neoforge-" + minecraft_version
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Warn about deprecated and unchecked usage
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
}

// Include resources generated by data generators.
sourceSets {
    data {
        compileClasspath += main.compileClasspath + main.output

        java {
            srcDirs = ['src/main/java', 'src/data/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

neoForge {
    evaluationDependsOnChildren()

    // Specify the version of NeoForge to use.
    version = project.neo_version
    validateAccessTransformers = true

    addModdingDependenciesTo sourceSets.data

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }


    // This line is optional. Access Transformers are automatically detected
//    accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.console.level', 'debug'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', "${project.mod_id}"
            programArguments.addAll '--username', secrets.getProperty("username") ?: 'Dev', secrets.getProperty("uuid") ? '--uuid' : '', secrets.getProperty("uuid") ?: ''
        }

        server {
            server()
            systemProperty 'forge.enabledGameTestNamespaces', "${project.mod_id}"
            programArgument '--nogui'
        }

        data {
            data()
            // Plain String, not a GString: ListProperty<String> will not coerce and prepareDataRun fails.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            sourceSet = this.sourceSets.data
        }
    }
}

dependencies {
    // JEI API, for recipe integration later
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"

    // Test mods for dev runs, nothing compiles against these.
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    runtimeOnly "curse.maven:just-enough-resources-jer-240630:6174588"
    runtimeOnly "curse.maven:jade-324717:6291517"
    runtimeOnly "curse.maven:cucumber-272335:6481512"
    runtimeOnly "curse.maven:worldedit-225608:5830452"
    runtimeOnly "curse.maven:reliquary-reincarnations-241319:7010155"
    runtimeOnly "curse.maven:simple-burnout-torch-1353923:7042561"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ─────────────────────────────────────────────────────────────
// Publishing (CurseForge + Modrinth)
//
// CurseForge rejects any file that carries no version from its "environment" group with error 1021,
// and the Java version has to be sent or it must be set by hand on the site after every release.
// CurseForgeGradle sends both; the cursegradle bundled in unified-publishing could send neither.
//
//   ./gradlew publishAll -PdryRun     resolve and log everything, upload nothing
//   ./gradlew publishAll              CurseForge first, then Modrinth
// ─────────────────────────────────────────────────────────────

// Read at publish time, not at config time. tasks.register defers this to when a publish is
// actually in the task graph, so an ordinary build never touches the file.
def releaseChangelog = {
    def file = rootProject.file("changelog/${minecraft_version}-${mod_version}.md")
    if (!file.exists()) {
        throw new GradleException("Missing changelog for publish: ${file}")
    }
    file.text
}

// Comma-separated CurseForge/Modrinth slugs; empty when the mod has no dependencies.
def requiredDeps = ((findProperty('curseforge_required_deps') ?: '') as String)
        .split(',').collect { it.trim() }.findAll { it }

tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    dependsOn tasks.jar
    apiToken = cfToken ?: ''
    debugMode = project.hasProperty('dryRun')

    def mainFile = upload(cfID, tasks.jar.archiveFile.get().asFile)
    mainFile.displayName = "${mod_name} - ${minecraft_version} - ${project.version}"
    mainFile.releaseType = 'release'
    mainFile.changelogType = 'markdown'
    mainFile.changelog = releaseChangelog()
    mainFile.addGameVersion(minecraft_version)
    mainFile.addModLoader('NeoForge')
    mainFile.addJavaVersion('Java 21')
    mainFile.addEnvironment('Client')
    mainFile.addEnvironment('Server')
    requiredDeps.each { mainFile.addRequirement(it) }
}

modrinth {
    token = mrToken ?: ''
    projectId = mrID
    versionNumber = project.version
    versionName = "${mod_name} ${project.version}"
    versionType = "release"
    uploadFile = tasks.jar
    gameVersions = [minecraft_version]
    loaders = ["neoforge"]
    changelog.set(providers.provider { releaseChangelog() })
    debugMode = project.hasProperty('dryRun')
    dependencies {
        requiredDeps.each { required.project it }
    }
}

tasks.named('modrinth') { mustRunAfter 'publishCurseForge' }

tasks.register('publishAll') {
    group = 'publishing'
    description = 'Publishes to CurseForge, then Modrinth.'
    dependsOn 'publishCurseForge', 'modrinth'
}